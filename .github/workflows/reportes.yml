name: Reportes DEP

on:
  # CRON DESACTIVADOS hasta la autorización (fase 3, paso 6). Para activarlos, descomentar las 4 líneas.
  # GitHub usa UTC y Chile cambia de horario; el worker decide por la hora de Santiago y termina sin hacer
  # nada si no le corresponde (ventana oficial 04:00-05:59 del lunes; preliminar 19:00-20:59 de martes a domingo).
  #   Oficial:    lunes 04:00 Santiago     = 07:00 UTC (verano, UTC-3) / 08:00 UTC (invierno, UTC-4)
  #   Preliminar: mar-dom 19:00 Santiago   = 22:00 UTC (verano)        / 23:00 UTC (invierno)
  #
  # audit-docs (auditoría documental, fase 2 bloque C): todos los días 07:00 Santiago
  #   = 10:00 UTC (verano, UTC-3) / 11:00 UTC (invierno, UTC-4). audit_docs.diario termina sin hacer nada
  #   si no son las 07 en Santiago. DESACTIVADO hasta la autorización de Ale y la verificación de Make
  #   (una tarea nueva cuyo Drive PR URL apunte a la carpeta PR): descomentar la línea "0 10,11 * * *".
  #
  # informe-horas (informe semanal de horas): jueves 07:00 Santiago = 10:00 UTC (verano) / 11:00 UTC (invierno).
  #   ACTIVO. informe_semanal_horas termina sin hacer nada fuera del jueves de 07:00 a 08:59 de Santiago. Sin aviso
  #   automático: los enlaces quedan en el log del job.
  schedule:
  #   - cron: "0 7,8 * * 1"
  #   - cron: "0 22,23 * * 0,2-6"
  #   - cron: "0 10,11 * * *"
    - cron: "0 10,11 * * 4"
  workflow_dispatch:
    inputs:
      trabajo:
        description: "Qué correr"
        type: choice
        options: [reporte, audit-docs, informe-horas]
        default: reporte
        required: true
      tipo:
        description: "Tipo de corrida"
        type: choice
        options: [preliminar, oficial]
        default: preliminar
        required: true
      corte:
        description: "Corte AAAA-MM-DD (opcional; oficial = último domingo, preliminar = ayer)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Dry-run (reporte: CSV como artefacto, sin escribir en Sheets; audit-docs: sin escribir en ClickUp ni Sheets; informe-horas: sin subir a Drive)"
        type: boolean
        default: true
      hoy:
        description: "informe-horas: fecha de corte AAAA-MM-DD (opcional; por defecto, hoy)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: reportes-dep
  cancel-in-progress: false

jobs:
  reporte:
    # El cron de audit-docs no dispara el reporte; a mano, según el input "trabajo".
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '0 10,11 * * *' && github.event.schedule != '0 10,11 * * 4') ||
      (github.event_name == 'workflow_dispatch' && inputs.trabajo != 'audit-docs' && inputs.trabajo != 'informe-horas')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONTZPATH: ""          # usar el paquete tzdata fijado en requirements-worker.txt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Instalar dependencias (versiones fijas)
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt

      - name: Ejecutar reporte
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEETS_REPORTES_ID: ${{ secrets.SHEETS_REPORTES_ID }}
          # Hoja aparte, restringida a los JP, con plan_vs_real por persona (dep_reportes/plan_vs_real.py)
          SHEETS_PLAN_VS_REAL_ID: ${{ secrets.SHEETS_PLAN_VS_REAL_ID }}
          EVENTO: ${{ github.event_name }}
          TIPO: ${{ inputs.tipo }}
          CORTE: ${{ inputs.corte }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--evento "$EVENTO" --corte "$CORTE" --dry-run "${DRY_RUN:-false}")
          if [ -n "$TIPO" ]; then args+=(--tipo "$TIPO"); fi
          python -m dep_reportes.worker "${args[@]}"

      - name: Subir respaldo previo a la escritura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}-${{ github.run_attempt }}
          path: reportes/respaldos/
          retention-days: 30
          if-no-files-found: ignore

      - name: Subir CSV del dry-run
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          # plan_vs_real.csv tiene datos por persona: no se sube como artefacto
          path: |
            reportes/dry_run/
            !reportes/dry_run/**/plan_vs_real.csv
          retention-days: 7
          if-no-files-found: ignore

  informe-horas:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 10,11 * * 4') ||
      (github.event_name == 'workflow_dispatch' && inputs.trabajo == 'informe-horas')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Instalar dependencias (versiones fijas)
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt

      # Solo lectura de ClickUp. Los HTML y el JSON no se suben como artefacto (nombres y horas de personas).
      - name: Informe semanal de horas
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_REFRESH_TOKEN_DRIVE_RW: ${{ secrets.GOOGLE_REFRESH_TOKEN_DRIVE_RW }}
          EVENTO: ${{ github.event_name }}
          HOY: ${{ inputs.hoy }}
          PUBLICAR: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          args=(--evento "$EVENTO")
          if [ -n "$HOY" ]; then args+=(--hoy "$HOY"); fi
          if [ "$PUBLICAR" = "true" ]; then args+=(--publicar); fi
          python -m informe_semanal_horas "${args[@]}"

  audit-docs:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 10,11 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.trabajo == 'audit-docs')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONTZPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Instalar dependencias (versiones fijas)
        run: python -m pip install --disable-pip-version-check -r requirements-worker.txt

      # recon (inventario + reglas) y sync de la checklist Documentos / Docs OK / pestaña docs_propuestas.
      # fix_links.py NO corre a diario. Los reportes de out/ no se suben como artefacto (nombres de personas).
      - name: Auditoría documental
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_REFRESH_TOKEN_DRIVE: ${{ secrets.GOOGLE_REFRESH_TOKEN_DRIVE }}
          SHEETS_REPORTES_ID: ${{ secrets.SHEETS_REPORTES_ID }}
          EVENTO: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--evento "$EVENTO")
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          python -m audit_docs.diario "${args[@]}"
